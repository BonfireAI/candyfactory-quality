[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "candyfactory-quality"
version = "0.1.0"
description = "CandyFactory gauge kit — the BubbleGum Law's gate battery and sticky-intro mount."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "CandyFactory" }]

[project.optional-dependencies]
dev = [
    # The gauge battery is pinned EXACTLY (== ) so the verdict is DETERMINISTIC:
    # ruff/mypy/complexipy output is version-sensitive, so a floating tool would
    # let the grade drift under the code. requirements-lock.txt freezes the full
    # transitive set; CI installs from it. Bump via a Constable cadence (BON-1665).
    "pytest==9.1.0",
    "ruff==0.15.17",
    "mypy==2.1.0",
    "mypy-baseline==0.7.4",
    "complexipy==5.6.0",
    # pyyaml: tests/test_workflows.py parses the CI workflow YAML surfaces.
    "pyyaml==6.0.3",
    # types-PyYAML: mypy stubs so the test battery type-checks at zero errors.
    "types-PyYAML==6.0.12.20260518",
    # import-linter: pinned EXACTLY — cf-import-contract's pass 2 parses its
    # observed output; a floating dep would let the oracle drift under the contract.
    "import-linter==2.11",
]

[project.scripts]
cf-file-budget = "cf_quality.file_budget:main"
cf-sticky-check = "cf_quality.sticky_check:main"
cf-mirror-check = "cf_quality.mirror_check:main"
cf-recursion-check = "cf_quality.recursion_check:main"
cf-exemptions = "cf_quality.exemptions:main"
cf-repo-config = "cf_quality.repo_config:main"
cf-import-contract = "cf_quality.import_contract:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The canonical sticky block (and its declared-mirror provenance note) ship
# INSIDE the wheel — cf-sticky-check loads them via importlib.resources, so a
# non-editable install (CI's exact mode) carries its own gauge data.
cf_quality = ["data/*.md"]

[tool.importlinter]
# The kit's OWN import contract — the gauge submits to the gate it ships
# (cf-import-contract; pinned settings per templates/import-contract.toml).
root_packages = ["cf_quality"]
include_external_packages = false
exclude_type_checking_imports = false

[[tool.importlinter.contracts]]
# The kit's measured layering: the six gate modules sit above repo_config
# (declared-layout resolution) above errors (the typed failure vocabulary).
# Sibling gates are independent — no gate imports another gate.
name = "the gates sit above repo_config above errors"
type = "layers"
containers = ["cf_quality"]
layers = [
    "exemptions | file_budget | import_contract | mirror_check | recursion_check | sticky_check",
    "repo_config",
    "errors",
]
unmatched_ignore_imports_alerting = "error"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C901", "PLR0915", "S", "BLE", "PGH004", "RUF100"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 50

[tool.ruff.lint.per-file-ignores]
# tests-context battery, measured estate-wide 2026-06-10; src keeps the full battery:
# S101 pytest assert · S105/S106 fake credentials · S603/S607 subprocess runs
# of the repo's own CLI · S608 fixture SQL · B017 broad pytest.raises.
# Glob set + battery mirror configs/ruff-base.toml (declared mirror — the kit
# submits to the gauge it ships).
"tests/*" = ["S101", "S105", "S106", "S603", "S607", "S608", "B017"]
"tests/**" = ["S101", "S105", "S106", "S603", "S607", "S608", "B017"]
"**/tests/*" = ["S101", "S105", "S106", "S603", "S607", "S608", "B017"]
"**/tests/**" = ["S101", "S105", "S106", "S603", "S607", "S608", "B017"]
"**/conftest.py" = ["S101", "S105", "S106", "S603", "S607", "S608", "B017"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]

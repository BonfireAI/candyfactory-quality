# candyfactory-quality · the shared quality gate — the BubbleGum Law's executable surface.
#
# Reusable-only: consumers call this workflow via the generated caller stub
# (templates/quality.caller.yml), pinned to a FULL commit SHA (docs/sha-pin-doctrine.md).
#
# NO inputs, by design (the inputs block stays empty forever): the Law-1 refuter
# showed that any skip/mode input is a neutering vector — a stub can "call the
# gate" while never gating. With zero declared inputs, GitHub itself rejects any
# caller that passes one (`with:` against an undeclared input is a workflow
# error), so a skip knob cannot even be smuggled in. Behavior differences live
# in committed consumer-repo state (baselines, MIRRORS.md), never in caller knobs.
name: quality-gate

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        # Consumer tree and kit tree are checked out side by side; every gate
        # command runs from the consumer root so the kit's own files are never
        # double-gated into the consumer's verdict.
        working-directory: repo
    steps:
      # FIRST, before any checkout: self-assert the trigger context. A caller
      # stub that filters triggers (workflow_dispatch-only, schedule, etc.) is
      # refused here. This closes the EVENT-TYPE variant of caller-stub
      # neutering only (DESIGN §4.8, verdict PARTIAL): caller-side `paths:`
      # filters, `continue-on-error` on the caller's job, and required-check
      # mounting are invisible from inside a reusable workflow; those vectors
      # remain procedural — mount runbook + mount canary + Constable sweep.
      - name: Self-assert trigger context (anti-neutering)
        working-directory: ${{ github.workspace }}
        env:
          EVENT: ${{ github.event_name }}
        run: |
          case "$EVENT" in
            push|pull_request)
              echo "trigger context OK: $EVENT"
              ;;
            *)
              echo "::error::quality-gate refused: trigger is '$EVENT' — the gate only counts on push/pull_request; a filtered caller stub is a neutered gate"
              exit 1
              ;;
          esac

      - name: Checkout consumer repo
        # In a reusable workflow the github context belongs to the CALLER, so a
        # bare checkout lands the consumer repo at the triggering ref.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: repo

      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Checkout the gauge kit at the calling SHA
        # `github.job_workflow_sha` is the commit the caller pinned this
        # reusable workflow to — so the gate scripts and this workflow file are
        # always the SAME commit (no gauge/workflow skew).
        #
        # The private-repo access assumption: the default GITHUB_TOKEN can read
        # BonfireAI/candyfactory-quality only because the kit repo grants
        # org-internal Actions access (Settings → Actions → General → Access:
        # "Accessible from repositories in the BonfireAI organization"). If that
        # grant is ever removed this step fails loudly with a 404 — the fix is
        # to restore the grant or pass a fine-grained PAT via the caller's
        # `secrets: inherit`.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: BonfireAI/candyfactory-quality
          ref: ${{ github.job_workflow_sha }}
          path: .cf-quality
          token: ${{ github.token }}

      - name: Install the gauge kit + pinned tool battery
        # [dev] carries ruff/mypy/mypy-baseline/pytest/complexipy — one gauge
        # block; the consumer never supplies its own copies of the gate tools.
        run: pip install "$GITHUB_WORKSPACE/.cf-quality[dev]"

      - name: Resolve the consumer's declared layout (cf-repo-config)
        # The zero-inputs doctrine stays intact: layout comes from COMMITTED
        # consumer state ([tool.cf-quality] in pyproject.toml or in
        # .cf-quality.toml), never from a caller knob. A declared source_root
        # that is missing, escapes the repo, or holds zero .py files FAILS
        # typed (GATE_CONFIG_INVALID) before anything is graded — pointing
        # the gauge at an empty room is a violation, not a pass (DESIGN.md
        # "Declared source roots"). Absent declaration keeps the historical
        # discovery exactly (src/ when present, else the repo root).
        run: |
          CF_SOURCE_ROOT="$(cf-repo-config source-root)"
          CF_PACKAGE_DIR="$(cf-repo-config package-dir)"
          echo "CF_SOURCE_ROOT=$CF_SOURCE_ROOT" >> "$GITHUB_ENV"
          echo "CF_PACKAGE_DIR=$CF_PACKAGE_DIR" >> "$GITHUB_ENV"
          echo "resolved source root: $CF_SOURCE_ROOT / package dir: $CF_PACKAGE_DIR"

      - name: Install the consumer package
        # Monorepo layouts (declared package_dir) install from the package's
        # own directory; the default is the repo root, exactly as before.
        run: |
          cd "$CF_PACKAGE_DIR"
          if [ ! -f pyproject.toml ]; then
            echo "::notice::no pyproject.toml — consumer package install skipped (gates still run)"
            exit 0
          fi
          EXTRA=$(python -c "import tomllib, pathlib; d = tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8')); print('dev' if 'dev' in d.get('project', {}).get('optional-dependencies', {}) else '')")
          if [ -n "$EXTRA" ]; then
            pip install -e '.[dev]'
          else
            pip install -e .
          fi

      - name: Assert the vendored ruff gauge is present
        # Local-dev hygiene only: the consumer's vendored copy serves editors
        # and pre-commit runs. The GATED verdict below rides the KIT's pinned
        # gauge directly — the refuter showed a hollowed vendored copy passed
        # this presence-only assert while neutering the battery, so presence
        # is asserted but fidelity is no longer trusted.
        run: |
          if [ ! -f ruff.toml ] && [ ! -f .ruff.toml ] && ! grep -q '^\[tool\.ruff' pyproject.toml 2>/dev/null; then
            echo "::error::no vendored ruff gauge found (ruff.toml / .ruff.toml / [tool.ruff]) — vendor configs/ruff-base.toml per the kit README"
            exit 1
          fi

      - name: ruff check (the kit's pinned gauge, never the consumer copy)
        # Same doctrine as mypy below: the config the verdict is graded by
        # comes from the kit checkout at the pinned SHA, so a consumer cannot
        # weaken the gauge it is graded by (hollow-vendored-copy refusal).
        run: ruff check . --config "$GITHUB_WORKSPACE/.cf-quality/configs/ruff-base.toml"

      - name: ruff format --check (the kit's pinned gauge)
        run: ruff format --check . --config "$GITHUB_WORKSPACE/.cf-quality/configs/ruff-base.toml"

      - name: cf-sticky-check — the sticky intro is mounted, byte-faithful
        run: cf-sticky-check check .

      - name: cf-file-budget — new files ≤ 500 lines, baseline shrink-only
        run: cf-file-budget check

      - name: cf-mirror-check — declared mirrors only (skip-if-no-MIRRORS.md)
        run: |
          if [ -f MIRRORS.md ]; then
            cf-mirror-check check --repo .
          else
            echo "::notice::cf-mirror-check SKIPPED — no MIRRORS.md in this repo; if it carries cross-repo copies, declare them (cf-mirror-check init)"
          fi

      - name: cf-recursion-check — recursion declared with a stated bound
        run: cf-recursion-check .

      - name: cf-exemptions — every suppression traces to a reasoned entry
        run: cf-exemptions

      - name: mypy through the baseline ratchet (a Python repo MUST carry a baseline)
        # The pipe is the design: mypy exits nonzero whenever baselined debt
        # exists; mypy-baseline filter is the gate (0 new errors), so the step
        # gates on the LAST command — deliberately no pipefail here.
        # The refuter showed "0 new type errors" was opt-in by file presence:
        # no mypy-baseline.txt meant NO type checking and a green gate. Now a
        # repo containing Python REFUSES to pass without a baseline (boot one
        # even at zero errors); only a Python-free repo may skip, visibly.
        # The measured target is CF_SOURCE_ROOT (cf-repo-config): the declared
        # source_root for monorepo layouts — the mount wave proved the old
        # root-level `src` discovery graded a VACUOUS tree there — else the
        # same src/root discovery as before, so a flat layout still cannot
        # escape via a hardcoded `src`. mypy-baseline.txt stays root-anchored.
        run: |
          if [ -f mypy-baseline.txt ]; then
            mypy "$CF_SOURCE_ROOT" --config-file "$GITHUB_WORKSPACE/.cf-quality/configs/mypy-base.toml" | mypy-baseline filter
          elif find . -name '*.py' -not -path '*/.*' | grep -q .; then
            echo "::error::mypy ratchet REFUSED — Python files present but no mypy-baseline.txt; boot the baseline per configs/BASELINE-CONVENTIONS.md (mypy src | mypy-baseline sync), even at zero errors"
            exit 1
          else
            echo "::notice::mypy ratchet SKIPPED — no Python files in this repo"
          fi

      - name: pytest
        # Plain pytest: a repo with zero collected tests exits 5 and FAILS the
        # floor on purpose — a floor without tests is prose, not a gate. Runs
        # in the declared package dir (a monorepo's pytest config + importable
        # package live there; from the umbrella root the suite collected
        # un-importable tests) — the repo root when nothing is declared.
        run: |
          cd "$CF_PACKAGE_DIR"
          pytest

# candyfactory-quality · the kit's OWN CI — the gauge submits to its own gate.
#
# Deliberately NOT via workflow_call: the kit runs cf-gate DIRECTLY (the same
# aggregating runner the reusable workflow ships) so a broken reusable workflow
# can never grade itself green — self-ci invokes cf-gate as a command,
# independent of quality-gate.yml's wiring. cf-gate runs the whole battery,
# collects one verdict per stage, and exits on the worst. The kit adopts at
# baseline zero: it commits a complexipy-snapshot.json watermark and synthesizes
# an empty mypy baseline (== bare mypy) so the ratchet stages run without debt.
name: self-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3 (node24)

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0 (node24)
        with:
          python-version: "3.12"

      - name: Install the kit + tool battery
        # PyYAML is a test-only dep (validates the workflow files themselves);
        # pyproject.toml is integrator-owned, so it is declared here instead.
        run: |
          pip install -e '.[dev]'
          pip install pyyaml

      - name: Boot the kit's zero mypy baseline (the kit adopts at baseline zero)
        # The kit owes 0 type errors, so it carries the canonical zero-boot
        # artifact: an EMPTY mypy-baseline.txt (BASELINE-CONVENTIONS.md §2 — a
        # zero-error repo boots an empty baseline). cf-gate's mypy stage runs
        # through the baseline ratchet and REFUSES a Python repo with none; an
        # empty baseline is exactly bare mypy — every reported error is "new"
        # and fails, nothing is laundered. Synthesized here (never committed):
        # mypy-baseline.txt is the one watermark the kit does not keep on disk
        # beside complexipy-snapshot.json.
        run: '[ -f mypy-baseline.txt ] || : > mypy-baseline.txt'

      - name: cf-gate — the kit submits to its own aggregated gate
        # DIRECT invocation of the installed console script — deliberately NOT
        # quality-gate.yml via workflow_call. This preserves the cannot-self-
        # grade-green property: a broken reusable-workflow YAML can never make
        # self-ci pass, because self-ci runs cf-gate as a command, independent
        # of that wiring. cf-gate runs the whole battery on the kit (ruff,
        # ruff-format, the cf-* gates, mypy, complexipy against the committed
        # snapshot, pytest), aggregates, and exits on the worst verdict; the
        # board is teed into the run log AND the step summary. NO
        # continue-on-error — the step's nonzero exit fails the job.
        run: |
          set +e
          {
            echo "### cf-gate — the kit's aggregated quality verdict"
            echo ""
            echo '```text'
          } >> "$GITHUB_STEP_SUMMARY"
          cf-gate | tee -a "$GITHUB_STEP_SUMMARY"
          status="${PIPESTATUS[0]}"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
